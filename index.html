<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Food Tracker</title>
<style>
  :root{
    --bg:#f7f7f8; --card:#fff; --line:#e4e4e7; --ink:#1c1c1e; --muted:#8a8a8e;
    --accent:#1a73e8; --ok:#137333; --err:#c5221f;
    --breakfast:#f6a609; --lunch:#2fa84f; --snacks:#8e5bd0; --dinner:#2b7de9;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
       max-width:520px;margin:0 auto;padding:0 12px 90px;-webkit-tap-highlight-color:transparent}
  h1{font-size:1.25rem;margin:14px 4px 6px}
  .muted{color:var(--muted)} .err{color:var(--err)} .ok{color:var(--ok)}
  button{font:inherit;border:0;border-radius:10px;padding:.55rem .9rem;background:var(--accent);color:#fff;cursor:pointer}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  input,select{font:inherit;padding:.5rem;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
 
  /* Date nav */
  .datenav{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}
  .datenav button{background:#fff;color:var(--ink);border:1px solid var(--line);width:42px;height:42px;border-radius:50%;font-size:1.2rem}
  .datenav .label{font-weight:600;min-width:150px;text-align:center}
 
  /* Mode tabs */
  .tabs{display:flex;gap:6px;margin:10px 0}
  .tabs button{flex:1;background:#fff;color:var(--ink);border:1px solid var(--line)}
  .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{margin:8px 0}
  video{width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover}
  .bigbtn{width:100%;padding:.9rem;font-size:1.05rem}
 
  /* Board */
  .group{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
  .group h2{display:flex;align-items:center;gap:8px;margin:0;padding:10px 12px;font-size:1rem;border-left:5px solid var(--line)}
  .group[data-group=breakfast] h2{border-color:var(--breakfast)}
  .group[data-group=lunch] h2{border-color:var(--lunch)}
  .group[data-group=snacks] h2{border-color:var(--snacks)}
  .group[data-group=dinner] h2{border-color:var(--dinner)}
  .group h2 .sub{margin-left:auto;color:var(--muted);font-weight:500;font-size:.85rem}
  .group h2 .copy{background:#fff;color:var(--accent);border:1px solid var(--line);padding:.25rem .5rem;font-size:.8rem;border-radius:8px}
  .list{min-height:38px;padding:4px 8px 10px}
  .item{display:flex;align-items:center;gap:10px;background:#fafafa;border:1px solid var(--line);border-radius:10px;
        padding:8px 10px;margin:6px 0;touch-action:none}
  .item .nm{flex:1;font-size:.95rem}
  .item .cal{color:var(--muted);font-size:.85rem;white-space:nowrap}
  .item .del{background:transparent;color:var(--muted);padding:0 6px;font-size:1.2rem;line-height:1}
  .empty{color:var(--muted);font-size:.85rem;padding:4px 6px}
  .sortable-ghost{opacity:.4}
 
  /* Totals bar */
  .totals{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
          max-width:520px;margin:0 auto;padding:8px 14px;display:flex;justify-content:space-between;font-size:.85rem}
  .totals b{font-size:1.05rem}
 
  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
  .modal.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px;max-height:92vh;overflow:auto}
  .sheet h3{margin:.2rem 0 .8rem}
  .field{margin:8px 0}
  .field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:3px}
  .macros{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row{display:flex;gap:8px;margin-top:14px}
  .row button{flex:1;padding:.8rem}
 
  /* Toast */
  #toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;
         padding:.6rem 1rem;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none}
  #toast.show{opacity:.96}
</style>
</head>
<body>
 
<!-- ===== EDIT THESE TWO LINES (paste your /exec URL again) ===== -->
<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbx9KHL1PRbK-o689d-JkPxM8Lf6UJQ8yUQ4jA5IXGdrD3hFngBgNx9Sk4q5UhBXsyzc/exec";
  const API_KEY = "";   // only if you set CONFIG.API_KEY in the script
</script>
<!-- ============================================================= -->
 
<h1>Food Tracker</h1>
 
<div class="datenav">
  <button id="prevDay">&lsaquo;</button>
  <span class="label" id="dateLabel">Today</span>
  <button id="nextDay">&rsaquo;</button>
</div>
 
<div class="tabs">
  <button data-mode="scan" class="active">Scan</button>
  <button data-mode="photo">Photo</button>
  <button data-mode="manual">Manual</button>
</div>
 
<div id="panel-scan" class="panel">
  <video id="cam" autoplay playsinline muted></video>
  <p class="muted" id="scanHint" style="font-size:.85rem">Point the camera at a barcode.</p>
</div>
<div id="panel-photo" class="panel" style="display:none">
  <button class="ghost bigbtn" id="photoBtn">📷 Photograph nutrition label</button>
  <p class="muted" style="font-size:.85rem">OCR pre-fills the form — check the numbers before logging.</p>
  <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
</div>
<div id="panel-manual" class="panel" style="display:none">
  <button class="bigbtn" id="manualBtn">＋ New manual entry</button>
</div>
 
<div id="board"><p class="muted">Loading…</p></div>
 
<div class="totals">
  <span>Total <b id="tCal">0</b> kcal</span>
  <span class="muted" id="tMacros">C 0 · F 0 · P 0</span>
</div>
 
<!-- Preview / edit modal -->
<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="mTitle">Log food</h3>
    <div class="field"><label>Item</label><input id="mItem" placeholder="e.g. Greek yogurt"></div>
    <div class="field"><label>Meal</label>
      <select id="mGroup">
        <option value="breakfast">Breakfast</option><option value="lunch">Lunch</option>
        <option value="snacks">Snacks</option><option value="dinner">Dinner</option>
      </select>
    </div>
    <div class="field" id="gramsField"><label>Grams (scales the values below)</label><input id="mGrams" type="number" value="100" inputmode="decimal"></div>
    <div class="macros">
      <div class="field"><label>Calories</label><input id="mCalories" type="number" inputmode="decimal"></div>
      <div class="field"><label>Carbs (g)</label><input id="mCarbs" type="number" inputmode="decimal"></div>
      <div class="field"><label>Fat (g)</label><input id="mFat" type="number" inputmode="decimal"></div>
      <div class="field"><label>Protein (g)</label><input id="mProtein" type="number" inputmode="decimal"></div>
      <div class="field"><label>Fiber (g)</label><input id="mFiber" type="number" inputmode="decimal"></div>
      <div class="field"><label>Sugar (g)</label><input id="mSugar" type="number" inputmode="decimal"></div>
    </div>
    <div class="row">
      <button class="ghost" id="mCancel">Cancel</button>
      <button id="mLog">Log it</button>
    </div>
  </div>
</div>
 
<div id="toast"></div>
 
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
const GROUPS = [["breakfast","Breakfast"],["lunch","Lunch"],["snacks","Snacks"],["dinner","Dinner"]];
let currentDate = new Date();
let scanning = false, lastScan = "", lastScanAt = 0;
let previewBase = null, previewBarcode = "";
 
/* ---------- JSONP helper (Promise-based) ---------- */
function api(params){
  return new Promise((resolve,reject)=>{
    if(API_URL.indexOf("PASTE_")===0){ reject(new Error("Set API_URL at the top of index.html")); return; }
    const cb = "cb_"+Date.now()+"_"+Math.floor(Math.random()*1e6);
    const s = document.createElement("script");
    const to = setTimeout(()=>{cleanup();reject(new Error("timeout"));}, 25000);
    function cleanup(){ clearTimeout(to); delete window[cb]; s.remove(); }
    window[cb] = out => { cleanup(); resolve(out); };
    const qs = Object.keys(params).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(params[k])).join("&");
    s.src = API_URL+"?"+qs+"&callback="+cb+(API_KEY?("&key="+encodeURIComponent(API_KEY)):"")+"&_="+Date.now();
    s.onerror = ()=>{ cleanup(); reject(new Error("network")); };
    document.body.appendChild(s);
  });
}
 
/* ---------- Date helpers ---------- */
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function isSameDay(a,b){ return fmt(a)===fmt(b); }
function dayLabel(d){
  const t=new Date(), y=new Date(); y.setDate(t.getDate()-1);
  if(isSameDay(d,t)) return "Today";
  if(isSameDay(d,y)) return "Yesterday";
  return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
}
function shiftDay(n){ currentDate.setDate(currentDate.getDate()+n); loadDay(); }
 
/* ---------- Toast ---------- */
let toastTimer;
function toast(msg,isErr){
  const el=document.getElementById("toast");
  el.textContent=msg; el.style.background=isErr?"#7a1f1b":"#1c1c1e"; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),2600);
}
 
/* ---------- Day board ---------- */
async function loadDay(){
  document.getElementById("dateLabel").textContent = dayLabel(currentDate);
  const board=document.getElementById("board");
  board.innerHTML='<p class="muted">Loading…</p>';
  try{
    const data=await api({action:"day",date:fmt(currentDate)});
    if(!data.ok) throw new Error(data.error||"failed");
    renderDay(data);
  }catch(e){ board.innerHTML='<p class="err">Could not load: '+e.message+'</p>'; }
}
 
function renderDay(data){
  const board=document.getElementById("board");
  const byGroup={breakfast:[],lunch:[],snacks:[],dinner:[]};
  data.items.forEach(it=>{ (byGroup[it.group]||byGroup.snacks).push(it); });
  board.innerHTML="";
  GROUPS.forEach(([key,label])=>{
    const list=byGroup[key];
    const sub=Math.round(list.reduce((s,i)=>s+i.calories,0));
    const sec=document.createElement("div");
    sec.className="group"; sec.dataset.group=key;
    sec.innerHTML=
      '<h2>'+label+
        '<span class="sub">'+sub+' kcal</span>'+
        '<button class="copy" data-group="'+key+'">Copy to…</button>'+
      '</h2>'+
      '<div class="list" data-group="'+key+'">'+
        (list.length?list.map(itemHTML).join(""):'<div class="empty">— empty —</div>')+
      '</div>';
    board.appendChild(sec);
  });
  // totals
  const t=data.totals;
  document.getElementById("tCal").textContent=Math.round(t.calories);
  document.getElementById("tMacros").textContent="C "+Math.round(t.carbs)+" · F "+Math.round(t.fat)+" · P "+Math.round(t.protein);
  wireBoard();
}
 
function itemHTML(it){
  return '<div class="item" data-id="'+it.id+'">'+
           '<span class="nm">'+escapeHTML(it.item)+'</span>'+
           '<span class="cal">'+Math.round(it.calories)+' kcal</span>'+
           '<button class="del" data-id="'+it.id+'" title="Remove">×</button>'+
         '</div>';
}
function escapeHTML(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
 
function wireBoard(){
  // delete buttons
  document.querySelectorAll(".del").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const id=b.dataset.id;
    if(!id){ toast("Old entry without ID — edit it in the sheet",true); return; }
    if(!confirm("Remove this entry?")) return;
    try{ const r=await api({action:"delete",id}); if(!r.ok) throw new Error(r.error); loadDay(); }
    catch(err){ toast("Delete failed: "+err.message,true); }
  });
  // copy-to buttons
  document.querySelectorAll(".copy").forEach(b=>b.onclick=async ()=>{
    const group=b.dataset.group;
    const next=new Date(currentDate); next.setDate(next.getDate()+1);
    const target=prompt("Copy "+group+" to which date? (YYYY-MM-DD)", fmt(next));
    if(!target) return;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(target)){ toast("Use format YYYY-MM-DD",true); return; }
    try{
      const r=await api({action:"copy",date:fmt(currentDate),group,target});
      if(!r.ok) throw new Error(r.error);
      toast("Copied "+r.count+" item(s) to "+target);
      if(target===fmt(currentDate)) loadDay();
    }catch(err){ toast("Copy failed: "+err.message,true); }
  });
  // drag & drop between meals (touch-friendly via SortableJS)
  document.querySelectorAll(".list").forEach(listEl=>{
    new Sortable(listEl,{
      group:"meals", animation:150, ghostClass:"sortable-ghost",
      onAdd:async evt=>{
        const id=evt.item.dataset.id;
        const newGroup=evt.to.dataset.group;
        if(!id){ toast("Old entry without ID — can't move",true); loadDay(); return; }
        try{ const r=await api({action:"move",id,group:newGroup}); if(!r.ok) throw new Error(r.error); }
        catch(err){ toast("Move failed: "+err.message,true); }
        loadDay();
      }
    });
  });
}
 
/* ---------- Modes ---------- */
function setMode(mode){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
  document.getElementById("panel-scan").style.display  = mode==="scan"?"":"none";
  document.getElementById("panel-photo").style.display = mode==="photo"?"":"none";
  document.getElementById("panel-manual").style.display= mode==="manual"?"":"none";
  if(mode==="scan") startScan(); else stopScan();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
 
/* ---------- Scan mode ---------- */
let stream=null, detector=null, scanTimer=null;
async function startScan(){
  const hint=document.getElementById("scanHint");
  if(!("BarcodeDetector" in window)){ hint.textContent="Camera scan unsupported on this browser — use Photo or Manual."; hint.className="err"; return; }
  if(!detector) detector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const v=document.getElementById("cam"); v.srcObject=stream; scanning=true;
    scanTimer=setInterval(async()=>{
      if(!scanning) return;
      try{
        const codes=await detector.detect(v);
        if(codes.length){
          const code=codes[0].rawValue, now=Date.now();
          if(code!==lastScan || now-lastScanAt>4000){ lastScan=code; lastScanAt=now; onBarcode(code); }
        }
      }catch(_){}
    },600);
  }catch(err){ hint.textContent="Camera error: "+err.message; hint.className="err"; }
}
function stopScan(){
  scanning=false; if(scanTimer){clearInterval(scanTimer);scanTimer=null;}
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
}
 
async function onBarcode(code){
  scanning=false;                       // pause while we look up + preview
  toast("Looking up "+code+"…");
  try{
    const r=await api({action:"lookup",barcode:code});
    if(r.ok){
      openPreview({title:"Log scanned item",item:r.item,base:r.per100,barcode:r.barcode});
    }else{
      toast(r.error||"Not found — enter manually",true);
      openPreview({title:"Not found — enter manually",item:"",barcode:code});
    }
  }catch(e){ toast("Lookup failed: "+e.message,true); scanning=true; }
}
 
/* ---------- Photo (OCR) mode ---------- */
document.getElementById("photoBtn").onclick=()=>document.getElementById("photoInput").click();
document.getElementById("photoInput").onchange=async e=>{
  const file=e.target.files[0]; if(!file) return;
  e.target.value="";
  toast("Reading label… (first time downloads the OCR engine)");
  try{
    const text=await runOCR(file);
    openPreview({title:"From label — check the numbers",item:guessName(text),macros:parseLabel(text)});
  }catch(err){ toast("OCR failed: "+err.message+" — enter manually",true); openPreview({title:"Enter manually",item:""}); }
};
let tessLoading=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tessLoading) return tessLoading;
  tessLoading=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload=res; s.onerror=()=>rej(new Error("could not load OCR library"));
    document.head.appendChild(s);
  });
  return tessLoading;
}
async function runOCR(file){
  await loadTesseract();
  const {data}=await Tesseract.recognize(file,"eng",{logger:()=>{}});
  return data.text||"";
}
function num(s){ if(s==null) return ""; const m=String(s).replace(",",".").match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):""; }
function near(text,re){ // first number on the same line as a keyword
  const lines=text.split(/\n/);
  for(const ln of lines){ if(re.test(ln)){ const m=ln.replace(",",".").match(/(\d+(\.\d+)?)/); if(m) return parseFloat(m[1]); } }
  return "";
}
function parseLabel(text){
  const t=text.toLowerCase();
  // calories: prefer an explicit kcal figure
  let cal=""; const k=t.replace(",",".").match(/(\d+(\.\d+)?)\s*k?cal/); if(k) cal=parseFloat(k[1]); else cal=near(t,/energ|calor/);
  return { calories:cal, carbs:near(t,/carbo/), fat:near(t,/(^|[^a-z])fat/),
           protein:near(t,/protein/), fiber:near(t,/fib(re|er)/), sugar:near(t,/sugar/) };
}
function guessName(text){ const ln=(text||"").split(/\n/).map(s=>s.trim()).filter(s=>s.length>2); return ln[0]?ln[0].slice(0,40):""; }
 
/* ---------- Manual ---------- */
document.getElementById("manualBtn").onclick=()=>openPreview({title:"New manual entry",item:""});
 
/* ---------- Preview / edit modal ---------- */
function defaultGroup(){ const h=new Date().getHours(); return h<11?"breakfast":h<15?"lunch":h<18?"snacks":"dinner"; }
function openPreview(opts){
  previewBase=opts.base||null; previewBarcode=opts.barcode||"";
  document.getElementById("mTitle").textContent=opts.title||"Log food";
  document.getElementById("mItem").value=opts.item||"";
  document.getElementById("mGroup").value=defaultGroup();
  document.getElementById("gramsField").style.display=previewBase?"":"none";
  document.getElementById("mGrams").value=100;
  const m=opts.macros||{};
  const src=previewBase?scaled(previewBase,100):m;
  setMacroFields(src);
  document.getElementById("modal").classList.add("show");
}
function setMacroFields(o){
  document.getElementById("mCalories").value=fix(o.calories);
  document.getElementById("mCarbs").value=fix(o.carbs);
  document.getElementById("mFat").value=fix(o.fat);
  document.getElementById("mProtein").value=fix(o.protein);
  document.getElementById("mFiber").value=fix(o.fiber);
  document.getElementById("mSugar").value=fix(o.sugar);
}
function fix(v){ return (v===""||v==null||isNaN(v))?"":Math.round(v*10)/10; }
function scaled(base,g){ const f=g/100; return {calories:base.calories*f,carbs:base.carbs*f,fat:base.fat*f,protein:base.protein*f,fiber:base.fiber*f,sugar:base.sugar*f}; }
document.getElementById("mGrams").oninput=()=>{ if(previewBase) setMacroFields(scaled(previewBase,parseFloat(document.getElementById("mGrams").value)||0)); };
function closeModal(){ document.getElementById("modal").classList.remove("show"); if(document.querySelector('.tabs button.active').dataset.mode==="scan"){ scanning=true; } }
document.getElementById("mCancel").onclick=closeModal;
document.getElementById("modal").onclick=e=>{ if(e.target.id==="modal") closeModal(); };
 
document.getElementById("mLog").onclick=async()=>{
  const v=id=>document.getElementById(id).value;
  const payload={ action:"add", item:v("mItem")||"Unnamed", group:v("mGroup"), barcode:previewBarcode,
    calories:num(v("mCalories")), carbs:num(v("mCarbs")), fat:num(v("mFat")),
    protein:num(v("mProtein")), fiber:num(v("mFiber")), sugar:num(v("mSugar")),
    date:fmt(currentDate) };
  document.getElementById("mLog").disabled=true;
  try{
    const r=await api(payload);
    if(!r.ok) throw new Error(r.error||"failed");
    closeModal(); toast("✓ Logged "+r.item); loadDay();
  }catch(e){ toast("Log failed: "+e.message,true); }
  finally{ document.getElementById("mLog").disabled=false; }
};
 
/* ---------- Init ---------- */
document.getElementById("prevDay").onclick=()=>shiftDay(-1);
document.getElementById("nextDay").onclick=()=>shiftDay(1);
document.getElementById("dateLabel").onclick=()=>{ currentDate=new Date(); loadDay(); };
setMode("scan");
loadDay();
</script>
</body>
</html>
