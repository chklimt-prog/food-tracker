<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Food Tracker</title>
<style>
  :root{
    --bg:#121316; --card:#1d1e22; --card2:#26272c; --line:#34353b; --ink:#ECECEF; --muted:#9b9ba3;
    --accent:#4c8dff; --ok:#34c759; --err:#ff6b62;
    --breakfast:#ffb020; --lunch:#3ecf6a; --snacks:#b07bff; --dinner:#4c8dff;
  }
  *{box-sizing:border-box}
  body{margin:0 auto;max-width:520px;padding:0 12px 92px;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
  h1{font-size:1.25rem;margin:14px 4px 4px}
  .muted{color:var(--muted)} .err{color:var(--err)} .ok{color:var(--ok)}
  button{font:inherit;border:0;border-radius:10px;padding:.55rem .9rem;background:var(--accent);color:#fff;cursor:pointer}
  button.ghost{background:var(--card2);color:var(--ink)}
  button:disabled{opacity:.5}
  input,select{font:inherit;padding:.55rem;border:1px solid var(--line);border-radius:9px;background:var(--card2);color:var(--ink);width:100%}

  .datenav{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}
  .datenav button{background:var(--card2);color:var(--ink);width:42px;height:42px;border-radius:50%;font-size:1.25rem;padding:0}
  .datenav .label{font-weight:600;min-width:150px;text-align:center}

  .tabs{display:flex;gap:6px;margin:10px 0}
  .tabs button{flex:1;background:var(--card2);color:var(--ink);padding:.55rem .3rem;font-size:.92rem}
  .tabs button.active{background:var(--accent);color:#fff}
  .panel{margin:8px 0}
  video{width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover;margin-top:8px}
  .bigbtn{width:100%;padding:.9rem;font-size:1.05rem}

  .group{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
  .group h2{display:flex;align-items:center;gap:8px;margin:0;padding:10px 12px;font-size:1rem;border-left:5px solid var(--line)}
  .group[data-group=breakfast] h2{border-color:var(--breakfast)}
  .group[data-group=lunch] h2{border-color:var(--lunch)}
  .group[data-group=snacks] h2{border-color:var(--snacks)}
  .group[data-group=dinner] h2{border-color:var(--dinner)}
  .group h2 .sub{margin-left:auto;color:var(--muted);font-weight:500;font-size:.85rem}
  .group h2 .copy{background:var(--card2);color:var(--accent);padding:.28rem .55rem;font-size:.8rem}
  .list{min-height:40px;padding:4px 8px 10px}
  .item{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:6px 0}
  .item .nm{flex:1;font-size:.95rem}
  .item .cal{color:var(--muted);font-size:.85rem;white-space:nowrap}
  .item .del{background:transparent;color:var(--muted);padding:0 8px;font-size:1.3rem;line-height:1;touch-action:auto}
  .empty{color:var(--muted);font-size:.85rem;padding:4px 6px}
  .sortable-ghost{opacity:.35}

  .recent{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin:7px 0;cursor:pointer}
  .recent .nm{flex:1} .recent .cal{color:var(--muted);font-size:.85rem}

  .totals{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);
          border-top:1px solid var(--line);padding:8px 16px;display:flex;flex-direction:column;gap:1px}
  .totals .kcal{font-size:.85rem}
  .totals b{font-size:1.1rem;color:var(--ink)}
  .totals .macroline{color:var(--muted);font-size:.82rem}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
  .modal.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px;max-height:92vh;overflow:auto}
  .sheet h3{margin:.2rem 0 .9rem}
  .field{margin:8px 0;position:relative}
  .field label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:3px}
  .macros{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row{display:flex;gap:8px;margin-top:14px}
  .row button{flex:1;padding:.8rem}

  /* autocomplete */
  .suggest{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card2);border:1px solid var(--line);
           border-radius:9px;margin-top:3px;max-height:230px;overflow:auto;display:none}
  .suggest .sg{display:flex;justify-content:space-between;gap:8px;padding:10px 11px;cursor:pointer;border-bottom:1px solid var(--line)}
  .suggest .sg:last-child{border-bottom:0}
  .suggest .sg:hover{background:var(--accent);color:#fff}
  .suggest .sgcal{color:var(--muted);font-size:.82rem;white-space:nowrap}
  .suggest .sg:hover .sgcal{color:#e8eefc}

  #toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:#000;color:#fff;
         padding:.6rem 1rem;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none;border:1px solid var(--line)}
  #toast.show{opacity:.97}
</style>
</head>
<body>

<!-- ===== EDIT THESE TWO LINES (paste your /exec URL again) ===== -->
<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzW7mWQQJ8IMhS-mNv5ivbuxPCpy77Ry0YCCY0-czCK6M4rF2OKn6XQ3349TIpB6nIw/exec";
  const API_KEY = "";
</script>
<!-- ============================================================= -->

<h1>Food Tracker</h1>

<div class="datenav">
  <button id="prevDay">&lsaquo;</button>
  <span class="label" id="dateLabel">Today</span>
  <button id="nextDay">&rsaquo;</button>
</div>

<div class="tabs">
  <button data-mode="scan" class="active">Scan</button>
  <button data-mode="photo">Photo</button>
  <button data-mode="manual">Manual</button>
  <button data-mode="recents">Recents</button>
</div>

<div id="panel-scan" class="panel">
  <button class="bigbtn" id="camToggle">📷 Start camera</button>
  <video id="cam" autoplay playsinline muted style="display:none"></video>
  <p class="muted" id="scanHint" style="font-size:.85rem">Tap to open the camera, then point it at a barcode.</p>
</div>
<div id="panel-photo" class="panel" style="display:none">
  <button class="ghost bigbtn" id="photoBtn">📷 Photograph label</button>
  <p class="muted" style="font-size:.85rem">Reads the nutrition values off the label. Always check them before logging.</p>
  <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
</div>
<div id="panel-manual" class="panel" style="display:none">
  <button class="bigbtn" id="manualBtn">＋ New manual entry</button>
</div>
<div id="panel-recents" class="panel" style="display:none">
  <div id="recentsList"><p class="muted">…</p></div>
</div>

<div id="board"><p class="muted">Loading…</p></div>

<div class="totals">
  <span class="kcal">Total <b id="tCal">0</b> kcal</span>
  <span class="macroline" id="tMacros">C 0 · F 0 · P 0 · Fib 0 · Sug 0</span>
</div>

<!-- Preview / edit modal -->
<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="mTitle">Log food</h3>
    <div class="field">
      <label>Item</label>
      <input id="mItem" placeholder="Start typing to search your foods…" autocomplete="off">
      <div class="suggest" id="suggest"></div>
    </div>
    <div class="field"><label>Meal</label>
      <select id="mGroup">
        <option value="breakfast">Breakfast</option><option value="lunch">Lunch</option>
        <option value="snacks">Snacks</option><option value="dinner">Dinner</option>
      </select>
    </div>
    <div class="field" id="gramsField"><label id="gramsLabel">Weight (g)</label><input id="mGrams" type="number" value="100" inputmode="decimal"></div>
    <div class="macros">
      <div class="field"><label>Calories</label><input id="mCalories" type="number" inputmode="decimal"></div>
      <div class="field"><label>Carbs (g)</label><input id="mCarbs" type="number" inputmode="decimal"></div>
      <div class="field"><label>Fat (g)</label><input id="mFat" type="number" inputmode="decimal"></div>
      <div class="field"><label>Protein (g)</label><input id="mProtein" type="number" inputmode="decimal"></div>
      <div class="field"><label>Fiber (g)</label><input id="mFiber" type="number" inputmode="decimal"></div>
      <div class="field"><label>Sugar (g)</label><input id="mSugar" type="number" inputmode="decimal"></div>
    </div>
    <div class="row">
      <button class="ghost" id="mCancel">Cancel</button>
      <button id="mLog">Log it</button>
    </div>
  </div>
</div>

<!-- Copy-to modal with date stepper -->
<div class="modal" id="copyModal">
  <div class="sheet">
    <h3 id="cTitle">Copy to…</h3>
    <div class="field"><label>Day</label></div>
    <div class="datenav">
      <button id="cPrev">&lsaquo;</button>
      <span class="label" id="cLabel">Today</span>
      <button id="cNext">&rsaquo;</button>
    </div>
    <div class="field"><label>Meal</label>
      <select id="cGroup">
        <option value="breakfast">Breakfast</option><option value="lunch">Lunch</option>
        <option value="snacks">Snacks</option><option value="dinner">Dinner</option>
      </select>
    </div>
    <div class="row">
      <button class="ghost" id="cCancel">Cancel</button>
      <button id="cConfirm">Copy here</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
const GROUPS=[["breakfast","Breakfast"],["lunch","Lunch"],["snacks","Snacks"],["dinner","Dinner"]];
let currentDate=new Date();
let scanning=false,lastScan="",lastScanAt=0;
let previewBase=null,previewBarcode="";
let copyGroupKey="",copyDate=new Date();
let foodsCache=[],foodsLoaded=false,foodsLoading=null;

/* ---------- JSONP ---------- */
function api(params){
  return new Promise((resolve,reject)=>{
    if(API_URL.indexOf("PASTE_")===0){reject(new Error("Set API_URL at the top of index.html"));return;}
    const cb="cb_"+Date.now()+"_"+Math.floor(Math.random()*1e6);
    const s=document.createElement("script");
    const to=setTimeout(()=>{cleanup();reject(new Error("timeout"));},25000);
    function cleanup(){clearTimeout(to);delete window[cb];s.remove();}
    window[cb]=out=>{cleanup();resolve(out);};
    const qs=Object.keys(params).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(params[k])).join("&");
    s.src=API_URL+"?"+qs+"&callback="+cb+(API_KEY?("&key="+encodeURIComponent(API_KEY)):"")+"&_="+Date.now();
    s.onerror=()=>{cleanup();reject(new Error("network"));};
    document.body.appendChild(s);
  });
}

/* ---------- dates ---------- */
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function sameDay(a,b){return fmt(a)===fmt(b);}
function dayLabel(d){const t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  if(sameDay(d,t))return "Today"; if(sameDay(d,y))return "Yesterday";
  return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});}
function shiftDay(n){currentDate.setDate(currentDate.getDate()+n);loadDay();}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg,isErr){const el=document.getElementById("toast");el.textContent=msg;
  el.style.borderColor=isErr?"var(--err)":"var(--line)";el.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2600);}

/* ---------- day board ---------- */
async function loadDay(){
  document.getElementById("dateLabel").textContent=dayLabel(currentDate);
  const board=document.getElementById("board");board.innerHTML='<p class="muted">Loading…</p>';
  try{const data=await api({action:"day",date:fmt(currentDate)});
    if(!data.ok)throw new Error(data.error||"failed");renderDay(data);
  }catch(e){board.innerHTML='<p class="err">Could not load: '+e.message+'</p>';}
}
function renderDay(data){
  const board=document.getElementById("board");
  const byGroup={breakfast:[],lunch:[],snacks:[],dinner:[]};
  data.items.forEach(it=>{(byGroup[it.group]||byGroup.snacks).push(it);});
  board.innerHTML="";
  GROUPS.forEach(([key,label])=>{
    const list=byGroup[key];
    const sub=Math.round(list.reduce((s,i)=>s+i.calories,0));
    const sec=document.createElement("div");sec.className="group";sec.dataset.group=key;
    sec.innerHTML='<h2>'+label+'<span class="sub">'+sub+' kcal</span>'+
      '<button class="copy" data-group="'+key+'">Copy to…</button></h2>'+
      '<div class="list" data-group="'+key+'">'+
      (list.length?list.map(itemHTML).join(""):'<div class="empty">— empty —</div>')+'</div>';
    board.appendChild(sec);
  });
  const t=data.totals;
  document.getElementById("tCal").textContent=Math.round(t.calories);
  document.getElementById("tMacros").textContent="C "+Math.round(t.carbs)+" · F "+Math.round(t.fat)+" · P "+Math.round(t.protein)+" · Fib "+Math.round(t.fiber)+" · Sug "+Math.round(t.sugar);
  wireBoard();
}
function itemHTML(it){return '<div class="item" data-id="'+it.id+'">'+
  '<span class="nm">'+esc(it.item)+(it.grams?' <span style="color:var(--muted);font-size:.8rem">'+esc(it.grams)+' g</span>':'')+'</span>'+
  '<span class="cal">'+Math.round(it.calories)+' kcal</span>'+
  '<button class="del" data-id="'+it.id+'" title="Remove">×</button></div>';}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function wireBoard(){
  document.querySelectorAll(".del").forEach(b=>b.addEventListener("click",async e=>{
    e.stopPropagation();
    const id=b.dataset.id;
    if(!id){toast("This entry has no ID — run 'Set up / migrate sheets' once",true);return;}
    if(!confirm("Remove this entry?"))return;
    try{const r=await api({action:"delete",id});if(!r.ok)throw new Error(r.error);toast("Removed");loadDay();}
    catch(err){toast("Delete failed: "+err.message,true);}
  }));
  document.querySelectorAll(".copy").forEach(b=>b.addEventListener("click",()=>openCopy(b.dataset.group)));
  document.querySelectorAll(".list").forEach(listEl=>{
    new Sortable(listEl,{
      group:"meals",animation:150,ghostClass:"sortable-ghost",
      filter:".del",preventOnFilter:false,
      delay:120,delayOnTouchOnly:true,
      onAdd:async evt=>{
        const id=evt.item.dataset.id,newGroup=evt.to.dataset.group;
        if(!id){toast("Entry has no ID — can't move",true);loadDay();return;}
        try{const r=await api({action:"move",id,group:newGroup});if(!r.ok)throw new Error(r.error);}
        catch(err){toast("Move failed: "+err.message,true);}
        loadDay();
      }
    });
  });
}

/* ---------- modes ---------- */
function setMode(mode){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
  ["scan","photo","manual","recents"].forEach(m=>document.getElementById("panel-"+m).style.display=(m===mode?"":"none"));
  if(mode!=="scan")stopScan();
  if(mode==="recents")loadRecents();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

/* ---------- scan (camera only on demand) ---------- */
let stream=null,detector=null,scanTimer=null;
document.getElementById("camToggle").onclick=()=>{ stream?stopScan():startScan(); };
async function startScan(){
  const hint=document.getElementById("scanHint");
  if(!("BarcodeDetector" in window)){hint.textContent="Barcode scanning unsupported here — use Photo or Manual.";hint.className="err";return;}
  if(!detector)detector=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const v=document.getElementById("cam");v.srcObject=stream;v.style.display="block";
    document.getElementById("camToggle").textContent="⏹ Stop camera";
    hint.textContent="Point at a barcode.";hint.className="muted";scanning=true;
    scanTimer=setInterval(async()=>{
      if(!scanning)return;
      try{const codes=await detector.detect(v);
        if(codes.length){const code=codes[0].rawValue,now=Date.now();
          if(code!==lastScan||now-lastScanAt>4000){lastScan=code;lastScanAt=now;onBarcode(code);}}
      }catch(_){}
    },600);
  }catch(err){hint.textContent="Camera error: "+err.message;hint.className="err";}
}
function stopScan(){
  scanning=false;if(scanTimer){clearInterval(scanTimer);scanTimer=null;}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  const v=document.getElementById("cam");v.style.display="none";v.srcObject=null;
  document.getElementById("camToggle").textContent="📷 Start camera";
}
async function onBarcode(code){
  scanning=false;toast("Looking up "+code+"…");
  try{const r=await api({action:"lookup",barcode:code});
    if(r.ok)openPreview({title:"Log scanned item",item:r.item,base:r.per100,barcode:r.barcode});
    else{toast(r.error||"Not found",true);openPreview({title:"Not found — enter manually",item:"",barcode:code});}
  }catch(e){toast("Lookup failed: "+e.message,true);scanning=true;}
}

/* ---------- photo (full label OCR, German + English) ---------- */
document.getElementById("photoBtn").onclick=()=>document.getElementById("photoInput").click();
document.getElementById("photoInput").onchange=async e=>{
  const file=e.target.files[0];if(!file)return;e.target.value="";
  toast("Reading label… (first use downloads the OCR engine)");
  try{const text=await runOCR(file);
    openPreview({title:"From label — check the values",item:guessName(text),macros:parseLabel(text)});
  }catch(err){toast("OCR failed: "+err.message,true);openPreview({title:"Enter manually",item:""});}
};
let tessLoading=null;
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve();
  if(tessLoading)return tessLoading;
  tessLoading=new Promise((res,rej)=>{const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload=res;s.onerror=()=>rej(new Error("could not load OCR library"));document.head.appendChild(s);});
  return tessLoading;
}
async function runOCR(file){await loadTesseract();
  const {data}=await Tesseract.recognize(file,"deu+eng",{logger:()=>{}});return data.text||"";}

// First number on the keyword line, or the line just below it (handles wrapped columns).
function near(text,re){
  const lines=text.split(/\n/);
  for(let i=0;i<lines.length;i++){
    if(re.test(lines[i])){
      for(let j=i;j<=i+1&&j<lines.length;j++){
        const m=lines[j].match(/(\d+(?:\.\d+)?)/);
        if(m)return parseFloat(m[1]);
      }
    }
  }
  return "";
}
function parseCalories(t){
  let m=t.match(/(\d+(?:\.\d+)?)\s*kcal/);                 if(m)return parseFloat(m[1]);
  m=t.match(/kcal[^0-9]{0,12}(\d+(?:\.\d+)?)/);             if(m)return parseFloat(m[1]);
  m=t.match(/calor(?:ies|ie)?[^0-9]{0,12}(\d+(?:\.\d+)?)/); if(m)return parseFloat(m[1]);
  for(const ln of t.split(/\n/)){
    if(/energ|brennwert/.test(ln)){const nums=(ln.match(/\d+(?:\.\d+)?/g)||[]).map(parseFloat);
      if(nums.length)return Math.min.apply(null,nums);}   // kcal is the smaller of kJ/kcal
  }
  return "";
}
function parseLabel(text){
  const t=text.toLowerCase().replace(/,/g,".");           // German uses comma decimals
  return {
    calories: parseCalories(t),
    fat:      near(t,/fett|tuky|\bfat\b/),                 // first "fett" = total (saturated comes later)
    carbs:    near(t,/kohlenhydrate|carbohydr|sacharid/),
    sugar:    near(t,/zucker|sugar|cukr/),
    fiber:    near(t,/ballaststoff|fib(?:er|re)|vl[aá]kn/),
    protein:  near(t,/eiwei|protein|b[ií]lkov/)
  };
}
function guessName(text){const ln=(text||"").split(/\n/).map(s=>s.trim()).filter(s=>s.length>2);return ln[0]?ln[0].slice(0,40):"";}

/* ---------- manual ---------- */
document.getElementById("manualBtn").onclick=()=>{ensureFoods();openPreview({title:"New manual entry",item:""});};

/* ---------- recents ---------- */
async function loadRecents(){
  const el=document.getElementById("recentsList");el.innerHTML='<p class="muted">Loading…</p>';
  try{const r=await api({action:"recents",limit:20});
    if(!r.ok)throw new Error(r.error);
    if(!r.items.length){el.innerHTML='<p class="muted">Nothing logged yet.</p>';return;}
    el.innerHTML="";
    r.items.forEach(it=>{
      const d=document.createElement("div");d.className="recent";
      d.innerHTML='<span class="nm">'+esc(it.item)+'</span><span class="cal">'+Math.round(it.calories)+' kcal</span>';
      d.onclick=()=>openPreview({title:"Add to log",item:it.item,barcode:it.barcode,
        macros:{calories:it.calories,carbs:it.carbs,fat:it.fat,protein:it.protein,fiber:it.fiber,sugar:it.sugar}});
      el.appendChild(d);
    });
  }catch(e){el.innerHTML='<p class="err">Could not load recents: '+e.message+'</p>';}
}

/* ---------- food autocomplete ---------- */
function ensureFoods(force){
  if(foodsLoaded&&!force)return Promise.resolve(foodsCache);
  if(foodsLoading)return foodsLoading;
  foodsLoading=api({action:"foods"})
    .then(r=>{foodsCache=(r&&r.ok)?r.items:foodsCache;foodsLoaded=true;foodsLoading=null;return foodsCache;})
    .catch(()=>{foodsLoading=null;return foodsCache;});
  return foodsLoading;
}
const itemInput=document.getElementById("mItem");
const suggestBox=document.getElementById("suggest");
let searchTimer=null;
function localMatches(q){return foodsCache.filter(f=>f.item.toLowerCase().indexOf(q)>=0).slice(0,6);}
function mergeFoods(a,b){const seen={},out=[];a.concat(b).forEach(f=>{const k=f.item.toLowerCase();if(seen[k])return;seen[k]=true;out.push(f);});return out.slice(0,14);}
function renderSuggest(list,searching){
  if(!list.length&&!searching){suggestBox.style.display="none";return;}
  suggestBox._matches=list;
  let html=list.map((f,i)=>'<div class="sg" data-i="'+i+'"><span>'+esc(f.item)+'</span>'+
    '<span class="sgcal">'+Math.round(f.calories)+(f.per100?" /100g":"")+'</span></div>').join("");
  if(searching)html+='<div class="sg" style="cursor:default;color:var(--muted)"><span>Searching Open Food Facts…</span></div>';
  suggestBox.innerHTML=html;
  suggestBox.querySelectorAll(".sg[data-i]").forEach(el=>el.addEventListener("pointerdown",ev=>{
    ev.preventDefault();applyFood(suggestBox._matches[+el.dataset.i]);}));
  suggestBox.style.display="block";
}
itemInput.addEventListener("input",()=>{
  const q=itemInput.value.trim().toLowerCase();
  clearTimeout(searchTimer);
  if(q.length<2){suggestBox.style.display="none";return;}
  if(!foodsLoaded)ensureFoods();
  renderSuggest(localMatches(q),true);                 // show your own foods instantly
  const qSnap=q;
  searchTimer=setTimeout(async()=>{                    // then add global results (debounced)
    let remote=[];
    try{const r=await api({action:"search",q:qSnap});if(r&&r.ok)remote=r.items;}catch(_){}
    if(itemInput.value.trim().toLowerCase()!==qSnap)return;   // user moved on
    renderSuggest(mergeFoods(localMatches(qSnap),remote),false);
  },400);
});
itemInput.addEventListener("blur",()=>setTimeout(()=>suggestBox.style.display="none",150));
function applyFood(f){
  itemInput.value=f.item;previewBarcode=f.barcode||"";
  if(f.per100){
    previewBase={calories:f.calories,carbs:f.carbs,fat:f.fat,protein:f.protein,fiber:f.fiber,sugar:f.sugar};
    document.getElementById("mGrams").value=100;setGramsMode(true);
    setMacros(scaled(previewBase,100));
  }else{
    previewBase=null;setGramsMode(false);
    setMacros({calories:f.calories,carbs:f.carbs,fat:f.fat,protein:f.protein,fiber:f.fiber,sugar:f.sugar});
  }
  suggestBox.style.display="none";
}

/* ---------- preview modal ---------- */
function defaultGroup(){const h=new Date().getHours();return h<11?"breakfast":h<15?"lunch":h<18?"snacks":"dinner";}
function openPreview(o){
  previewBase=o.base||null;previewBarcode=o.barcode||"";
  document.getElementById("mTitle").textContent=o.title||"Log food";
  itemInput.value=o.item||"";suggestBox.style.display="none";
  document.getElementById("mGroup").value=defaultGroup();
  document.getElementById("mGrams").value=o.grams||100;
  setGramsMode(!!previewBase);
  setMacros(previewBase?scaled(previewBase,100):(o.macros||{}));
  document.getElementById("modal").classList.add("show");
}
function setGramsMode(hasBase){
  document.getElementById("gramsField").style.display="";   // always shown now
  document.getElementById("gramsLabel").textContent=hasBase?"Weight (g) — scales the values below":"Weight (g) eaten";
}
function setMacros(o){["calories","carbs","fat","protein","fiber","sugar"].forEach(k=>{
  document.getElementById("m"+k[0].toUpperCase()+k.slice(1)).value=fix(o[k]);});}
function fix(v){return(v===""||v==null||isNaN(v))?"":Math.round(v*10)/10;}
function scaled(b,g){const f=g/100;return{calories:b.calories*f,carbs:b.carbs*f,fat:b.fat*f,protein:b.protein*f,fiber:b.fiber*f,sugar:b.sugar*f};}
document.getElementById("mGrams").oninput=()=>{if(previewBase)setMacros(scaled(previewBase,parseFloat(document.getElementById("mGrams").value)||0));};
function closeModal(){document.getElementById("modal").classList.remove("show");suggestBox.style.display="none";
  if(document.querySelector(".tabs button.active").dataset.mode==="scan"&&stream)scanning=true;}
document.getElementById("mCancel").onclick=closeModal;
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal();};
document.getElementById("mLog").onclick=async()=>{
  const v=id=>document.getElementById(id).value;
  const payload={action:"add",item:v("mItem")||"Unnamed",group:v("mGroup"),barcode:previewBarcode,grams:num(v("mGrams")),
    calories:num(v("mCalories")),carbs:num(v("mCarbs")),fat:num(v("mFat")),
    protein:num(v("mProtein")),fiber:num(v("mFiber")),sugar:num(v("mSugar")),date:fmt(currentDate)};
  document.getElementById("mLog").disabled=true;
  try{const r=await api(payload);if(!r.ok)throw new Error(r.error||"failed");
    foodsCache.unshift({item:payload.item,barcode:payload.barcode,per100:false,
      calories:Number(payload.calories)||0,carbs:Number(payload.carbs)||0,fat:Number(payload.fat)||0,
      protein:Number(payload.protein)||0,fiber:Number(payload.fiber)||0,sugar:Number(payload.sugar)||0});
    ensureFoods(true);                       // resync the list in the background
    closeModal();toast("✓ Logged "+r.item);loadDay();}
  catch(e){toast("Log failed: "+e.message,true);}
  finally{document.getElementById("mLog").disabled=false;}
};
function num(s){if(s==null)return"";const m=String(s).replace(",",".").match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):"";}

/* ---------- copy modal ---------- */
function openCopy(group){copyGroupKey=group;copyDate=new Date();
  document.getElementById("cTitle").textContent="Copy "+group+" to…";
  document.getElementById("cGroup").value=group;
  renderCopyLabel();document.getElementById("copyModal").classList.add("show");}
function renderCopyLabel(){document.getElementById("cLabel").textContent=dayLabel(copyDate);}
document.getElementById("cPrev").onclick=()=>{copyDate.setDate(copyDate.getDate()-1);renderCopyLabel();};
document.getElementById("cNext").onclick=()=>{copyDate.setDate(copyDate.getDate()+1);renderCopyLabel();};
document.getElementById("cCancel").onclick=()=>document.getElementById("copyModal").classList.remove("show");
document.getElementById("copyModal").onclick=e=>{if(e.target.id==="copyModal")e.currentTarget.classList.remove("show");};
document.getElementById("cConfirm").onclick=async()=>{
  const target=fmt(copyDate),targetGroup=document.getElementById("cGroup").value;
  document.getElementById("cConfirm").disabled=true;
  try{const r=await api({action:"copy",date:fmt(currentDate),group:copyGroupKey,target,targetGroup});
    if(!r.ok)throw new Error(r.error);
    document.getElementById("copyModal").classList.remove("show");
    toast("Copied "+r.count+" item(s) to "+targetGroup+" · "+dayLabel(copyDate).toLowerCase());
    if(target===fmt(currentDate))loadDay();
  }catch(e){toast("Copy failed: "+e.message,true);}
  finally{document.getElementById("cConfirm").disabled=false;}
};

/* ---------- init ---------- */
document.getElementById("prevDay").onclick=()=>shiftDay(-1);
document.getElementById("nextDay").onclick=()=>shiftDay(1);
document.getElementById("dateLabel").onclick=()=>{currentDate=new Date();loadDay();};
setMode("scan");
loadDay();
ensureFoods();   // prefetch the food list so suggestions are instant
</script>
</body>
</html>
